services:
  backend:
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_PATH: /data/weather.db
    volumes:
      - dbdata:/data

  frontend:
    build: ./frontend

  gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  dbdata: