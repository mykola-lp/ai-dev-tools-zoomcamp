spring.application.name=weather-analytics-backend
server.port=${PORT:8080}

# --- JPA / Persistence ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Security: no generated default user, bearer-token auth is implemented in code ---
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Application ---
app.auth.token-ttl=P30D
app.auth.cookie-name=SESSION
app.auth.cookie-secure=${COOKIE_SECURE:false}

app.weather.open-meteo-base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
app.weather.timeout=PT15S
app.weather.min-age.current=PT5M
app.weather.min-age.forecast=PT30M
app.weather.min-age.historical=PT6H
app.weather.scheduler.enabled=true
app.weather.scheduler.initial-delay=PT30S
app.weather.scheduler.interval=PT30M

app.seed.enabled=${SEED_ENABLED:true}
app.seed.demo-email=demo@example.com
app.seed.demo-password=${DEMO_PASSWORD:demo1234}

app.dashboard.default-city-ids=lisbon,london,kyiv

# --- Swagger ---
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html
