# Every Spring context created by the tests gets its own throw-away SQLite file.
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/weather-test-${random.uuid}.db?foreign_keys=on&busy_timeout=5000
app.seed.enabled=false
app.weather.scheduler.enabled=false
app.weather.min-age.current=PT0S
app.weather.min-age.forecast=PT0S
app.weather.min-age.historical=PT0S
