name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: 02-development/backend
        run: ./mvnw -B test

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 02-development/frontend/package-lock.json

      - name: Install dependencies
        working-directory: 02-development/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: 02-development/frontend
        run: npm test

  integration-and-e2e:
    name: Integration + E2E
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            02-development/integration-tests/package-lock.json
            02-development/e2e/package-lock.json

      - name: Build CI stack
        working-directory: 02-development
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            build

      - name: Start CI stack
        working-directory: 02-development
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            up -d

      - name: Wait for application
        working-directory: 02-development
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8000/api/weather/freshness > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready"
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            ps

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            logs --no-color

          exit 1

      - name: Install integration-test dependencies
        working-directory: 02-development/integration-tests
        run: npm ci

      - name: Run integration tests
        working-directory: 02-development/integration-tests
        env:
          IT_BASE_URL: http://localhost:8000/api
        run: npm test

      - name: Install E2E dependencies
        working-directory: 02-development/e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: 02-development/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: 02-development/e2e
        run: npx playwright test

      - name: Show Docker logs on failure
        if: failure()
        working-directory: 02-development
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            ps

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            logs --no-color

      - name: Stop CI stack
        if: always()
        working-directory: 02-development
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            down -v --remove-orphans
